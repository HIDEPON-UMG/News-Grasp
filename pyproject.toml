[project]
name = "news-grasp"
version = "0.1.0"
description = "News Grasp ニュースダイジェスト配信 + 公開 web 配信パイプライン"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "pywebpush>=2.0",  # Web Push 通知の送信 (tools/send_push.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q"
markers = [
    "network: 外部サービス、公開 URL、ローカル実エンジンに依存する test。runner の pytest-static gate では除外する。",
]
