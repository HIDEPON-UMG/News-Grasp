<!-- PWA: manifest + theme + iOS/Android web-app meta + Service Worker 登録 -->
<link rel="manifest" href="/News-Grasp/manifest.webmanifest">
<meta name="theme-color" content="#181C2A">
<meta name="color-scheme" content="light">
<meta name="application-name" content="News Grasp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="News Grasp">
<meta name="mobile-web-app-capable" content="yes">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/News-Grasp/sw.js', { scope: '/News-Grasp/' }).catch((err) => {
        console.warn('[News Grasp] SW register failed:', err);
      });
    });
  }
</script>
