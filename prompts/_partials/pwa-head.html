<!-- PWA: manifest + theme + iOS/Android web-app meta + Service Worker 登録 -->
<link rel="manifest" href="/News-Grasp/manifest.webmanifest">
<meta name="theme-color" content="#181C2A">
<meta name="color-scheme" content="light">
<meta name="application-name" content="News Grasp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="News Grasp">
<meta name="mobile-web-app-capable" content="yes">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/News-Grasp/sw.js', { scope: '/News-Grasp/' }).catch((err) => {
        console.warn('[News Grasp] SW register failed:', err);
      });
    });
  }
  // 縦画面固定: インストール済み PWA (standalone) では実行時に portrait ロック。
  // インストール時の古い manifest がキャッシュされていても再インストール不要で効く。
  // ブラウザタブ / iOS Safari では仕様上 reject されるため握りつぶす (Web では回転ロック不可)。
  (function lockPortrait() {
    try {
      var o = screen.orientation;
      if (o && typeof o.lock === 'function') {
        o.lock('portrait').catch(function () {});
      }
    } catch (e) { /* 非対応環境は無視 */ }
  })();
</script>
