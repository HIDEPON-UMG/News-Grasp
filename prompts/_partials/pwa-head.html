<!-- PWA: manifest + theme + iOS/Android web-app meta + Service Worker 登録 -->
<link rel="manifest" href="/News-Grasp/manifest.webmanifest">
<meta name="theme-color" content="#181C2A">
<meta name="color-scheme" content="light">
<meta name="application-name" content="News Grasp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="News Grasp">
<meta name="mobile-web-app-capable" content="yes">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/News-Grasp/sw.js', { scope: '/News-Grasp/' }).catch((err) => {
        console.warn('[News Grasp] SW register failed:', err);
      });
    });
  }
  // 縦画面固定: インストール済み PWA (standalone) では実行時に portrait ロック。
  // インストール時の古い manifest がキャッシュされていても再インストール不要で効く。
  // ブラウザタブ / iOS Safari では仕様上 reject されるため握りつぶす (Web では回転ロック不可)。
  (function lockPortrait() {
    try {
      var o = screen.orientation;
      if (o && typeof o.lock === 'function') {
        o.lock('portrait').catch(function () {});
      }
    } catch (e) { /* 非対応環境は無視 */ }
  })();
  // サムネイル画像の読込失敗 (404 / CORS / タイムアウト / 壊れた placeholder URL) を
  // 1 箇所で捕捉し、必ずカテゴリ既定画像へ差し替える。これで「壊れアイコン」を全ページで
  // 絶対に出さない (個別 onerror を撒くより境界集約のほうが漏れない・二重適用も防ぐ)。
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    if (img.dataset.ngFallback) return;                 // 適用済み: 無限ループ防止
    if (img.classList.contains('brand-icon')) return;   // ブランドアイコンは対象外
    img.dataset.ngFallback = '1';
    // base_url は site.css の link href から動的に導出 (preview/本番のパス差を吸収)
    var link = document.querySelector('link[rel="stylesheet"][href*="/assets/site.css"]');
    var base = link ? link.getAttribute('href').replace(/\/assets\/site\.css.*$/, '') : '';
    var cat = (document.body && document.body.dataset.category) || 'summary';
    img.src = base + '/assets/og/' + cat + '.jpg';
  }, true);  // capture=true: img の error はバブリングしないため
</script>
