<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>日付アーカイブ — {{ site_title }}</title>
<meta name="description" content="{{ site_title }} の日付順アーカイブ。全カテゴリ横断。">
<link rel="canonical" href="{{ canonical }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_title }}">
<meta property="og:title" content="日付アーカイブ — {{ site_title }}">
<meta property="og:description" content="{{ site_title }} の日付順アーカイブ。全カテゴリ横断。">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ base_url }}/assets/og/summary.jpg">
<meta property="og:image:width" content="1120">
<meta property="og:image:height" content="587">
<meta property="og:locale" content="ja_JP">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="日付アーカイブ — {{ site_title }}">
<meta name="twitter:description" content="{{ site_title }} の日付順アーカイブ。全カテゴリ横断。">
<meta name="twitter:image" content="{{ base_url }}/assets/og/summary.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ base_url }}/assets/site.css">
</head>
<body data-category="summary">
<div class="archive-page">

  <header class="site-header">
    <div class="site-title"><a href="{{ base_url }}/">{{ site_title }}</a></div>
    <div class="site-tagline">時勢を掴み、日々に新たに。</div>
  </header>

  <div class="article-header">
    <div class="article-meta"><span class="accent">ARCHIVE</span> &nbsp;·&nbsp; {{ days|length }} days</div>
    <h1 class="article-title">日付アーカイブ</h1>
  </div>

  {% for day in days %}
  <section style="margin-bottom: var(--space-2xl);">
    <h2 style="font-family: var(--font-serif); font-size: 1.5rem; font-weight: 800; margin: 0 0 var(--space-md); padding-bottom: var(--space-xs); border-bottom: 1px solid var(--color-border);">{{ day.date }}</h2>
    <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: var(--space-sm); flex-wrap: wrap;">
      {% for it in day.entries %}
      <li>
        <a href="{{ it.canonical }}" class="cat-badge cat-{{ it.category_id }}" style="text-decoration: none;" title="{{ it.title }}">{{ it.category_jp }}</a>
      </li>
      {% endfor %}
    </ul>
  </section>
  {% endfor %}

  <footer class="site-footer">
    <div><a href="{{ base_url }}/">← トップ</a></div>
    <div>{{ total_pages }} pages</div>
  </footer>

</div>
</body>
</html>
